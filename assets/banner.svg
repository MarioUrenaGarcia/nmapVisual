<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" font-family="'Cascadia Code','Consolas','SFMono-Regular',Menlo,monospace" role="img" aria-label="nmap Visual">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131a23"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#39c5cf"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39c5cf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#39c5cf" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="918" height="278" rx="18" fill="url(#bg)" stroke="#243040"/>

  <!-- rejilla sutil -->
  <g stroke="#1d2733" stroke-width="1">
    <path d="M0 70 H920 M0 140 H920 M0 210 H920"/>
    <path d="M160 0 V280 M320 0 V280 M480 0 V280 M640 0 V280 M800 0 V280"/>
  </g>

  <!-- titulo -->
  <text x="54" y="104" font-size="58" font-weight="700" fill="#2f81f7" filter="url(#glow)">nmap</text>
  <text x="250" y="104" font-size="30" fill="#8b98a8" letter-spacing="6">VISUAL</text>
  <text x="56" y="146" font-size="18" fill="#e6edf3">Escaneo de red, visual y en vivo</text>

  <!-- linea de terminal con cursor -->
  <text x="56" y="188" font-size="16" fill="#39c5cf">$ nmap -sn 192.168.1.0/24</text>
  <rect x="300" y="175" width="10" height="17" fill="#39c5cf">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- barra de progreso -->
  <rect x="56" y="214" width="360" height="8" rx="4" fill="#1b2430"/>
  <rect x="56" y="214" width="40" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" values="20;360;360" keyTimes="0;0.8;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="244" font-size="12" fill="#5c6878">descubriendo hosts, puertos y servicios en tiempo real</text>

  <!-- grafo de red animado -->
  <g transform="translate(700,140)">
    <!-- barrido radar -->
    <g>
      <path d="M0 0 L112 0 A112 112 0 0 1 79 79 Z" fill="url(#sweep)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- aristas -->
    <g stroke="#2f81f7" stroke-width="1.4" stroke-opacity="0.55" fill="none" stroke-dasharray="4 5">
      <line x1="0" y1="0" x2="0" y2="-95"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="82" y2="-47"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.4s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="82" y2="47"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.1s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="0" y2="95"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.5s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-82" y2="47"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.3s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-82" y2="-47"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.6s" repeatCount="indefinite"/></line>
    </g>

    <!-- nodos -->
    <g>
      <circle cx="0" cy="-95" r="8" fill="#3fb950"><animate attributeName="r" values="8;11;8" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.55;1;0.55" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="82" cy="-47" r="8" fill="#39c5cf"><animate attributeName="r" values="8;11;8" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.55;1;0.55" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="82" cy="47" r="8" fill="#f85149"><animate attributeName="r" values="8;12;8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.55;1;0.55" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="95" r="8" fill="#39c5cf"><animate attributeName="r" values="8;11;8" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.55;1;0.55" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="-82" cy="47" r="8" fill="#3fb950"><animate attributeName="r" values="8;11;8" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.55;1;0.55" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="-82" cy="-47" r="8" fill="#d29922"><animate attributeName="r" values="8;11;8" dur="2.4s" begin="2s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.55;1;0.55" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- nodo central -->
    <circle cx="0" cy="0" r="24" fill="#1f6feb" fill-opacity="0.22" stroke="#2f81f7" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#2f81f7" stroke-width="1.6">
      <animate attributeName="r" values="24;40;24" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" font-size="14" text-anchor="middle" fill="#e6edf3">Red</text>
  </g>
</svg>
